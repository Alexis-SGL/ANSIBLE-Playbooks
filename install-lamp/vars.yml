doc_root: /var/www/{{ fqdn }}
vhost: "vhost.conf.j2"

php_version: "8.4"

web:
  - "php{{ php_version }}"
  - "php{{ php_version }}-cli"
  - "php{{ php_version }}-common"
  - "php{{ php_version }}-mysql"
  - "libapache2-mod-php{{ php_version }}"
  - apache2

#Choisir 'mysql' ou 'mariadb'
database: mysql

mysql:
  - mysql-server

mariadb:
  - mariadb-server

phpmyadmin:
  - phpmyadmin
  - python3-pymysql

db_user: admin
db_password: phpmyadmin
