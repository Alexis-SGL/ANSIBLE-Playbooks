[aruba_ocss]
switch_aruba_2530_1 ansible_host=IP_MACHINE ansible_user=USER_NAME ansible_password=USER_PASSWORD
 
[aruba_ocss:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=arubanetworks.aos_switch.arubaoss
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa'
ansible_become=no
ansible_command_timeout=180
