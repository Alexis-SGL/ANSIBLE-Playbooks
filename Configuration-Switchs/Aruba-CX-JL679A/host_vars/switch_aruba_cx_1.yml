# Informations du switch
nom_switch: "MON-SWITCH-01"
contact_switch: "admin@mon-domaine.fr"
emplacement_switch: "Salle serveur - Bâtiment A"
 
# RADIUS
radius_server_1: "IP_RADIUS_1"
radius_server_2: "IP_RADIUS_2"
radius_key_1: "ma_cle_radius_1"
radius_key_2: "ma_cle_radius_2"
radius_timeout: 5
radius_retransmit: 3
radius_group: "mon-groupe-radius"
 
# Rôles port-access
role_authentifie: "AUTH"
role_non_authentifie: "NOAUTH"
 
# VLANs
vlans:
  - { id: 10,  nom: "CLIENTS" }
  - { id: 100, nom: "NOAUTH" }
 
# Ports
