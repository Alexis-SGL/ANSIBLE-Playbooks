[aruba_cx]
switch_aruba_cx_1 ansible_host=IP_MACHINE ansible_user=USER_NAME ansible_password=USER_PASSWORD
 
[aruba_cx:vars]
ansible_connection=network_cli
ansible_network_os=arubanetworks.aoscx.aoscx
ansible_become=no
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10'
ansible_command_timeout=60
ansible_connect_timeout=60
